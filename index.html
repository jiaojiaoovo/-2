<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>虚拟小手机</title>
<!-- 本文件里没有任何真实 API Key。Key 只在“设置”里填写,保存在你自己浏览器的本地存储中。 -->
<style>
:root{--bg:#f3f1f8;--card:#fff;--text:#201c2b;--sub:#706b80;--line:#e4e0ee;--accent:#7a5cf0;--ok:#157a43;--err:#c0262d;--frame:#17141f}
@media (prefers-color-scheme:dark){:root{--bg:#14121b;--card:#201d2b;--text:#f1eff7;--sub:#a29cb4;--line:#322e40;--accent:#a08bff;--ok:#5be39a;--err:#ff8087;--frame:#050408}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center}
.phone{width:390px;height:780px;max-height:96vh;background:var(--frame);border-radius:48px;padding:10px;box-shadow:0 24px 60px rgba(20,10,50,.35)}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:linear-gradient(165deg,#5b4bd6 0%,#b36bd6 55%,#ffa6b8 100%)}
.status{position:absolute;top:0;left:0;right:0;height:44px;padding:0 26px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:#fff;z-index:5;pointer-events:none}
.screen.open .status{color:var(--text)}
.home{position:absolute;inset:0;padding:70px 24px 0;color:#fff}
.clock{font-size:64px;font-weight:300;letter-spacing:-2px;text-align:center}
.date{text-align:center;font-size:15px;opacity:.9;margin-bottom:48px}
.icon{width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.icon i{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:30px;font-style:normal}
.icon:active i{transform:scale(.94)}
.app{position:absolute;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:44px}
.screen.open .app{transform:none}
.bar{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.bar h1{font-size:22px}
.back{border:0;background:none;color:var(--accent);font-size:16px;cursor:pointer;padding:6px 4px}
.body{flex:1;overflow-y:auto;padding:4px 16px 48px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.row{display:flex;gap:8px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{flex:none;padding:12px 14px}
.actions{margin-top:18px}
.res{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--card);border-left:4px solid var(--line);font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.res.ok{border-color:var(--ok)}.res.err{border-color:var(--err)}
.res b{display:block;font-size:15px}
.res.ok b{color:var(--ok)}.res.err b{color:var(--err)}
details{margin-top:16px;font-size:13px;color:var(--sub)}
pre{margin-top:8px;padding:10px;border-radius:10px;background:var(--card);white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto;font-size:12px}
.homebar{position:absolute;bottom:8px;left:50%;width:130px;height:22px;transform:translateX(-50%);border:0;background:none;z-index:6;cursor:pointer}
.homebar::after{content:"";display:block;margin:9px auto 0;width:110px;height:5px;border-radius:3px;background:#fff;opacity:.85}
.screen.open .homebar::after{background:var(--text);opacity:.5}
@media (max-width:480px){body{display:block}.phone{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0}.screen{border-radius:0}}
@media (prefers-reduced-motion:reduce){.app{transition:none}}
</style>
</head>
<body>
<div class="phone">
 <div class="screen" id="screen">
  <div class="status"><span id="stime">--:--</span><span>5G ▮▮▮</span></div>

  <div class="home">
   <div class="clock" id="clock">--:--</div>
   <div class="date" id="date"></div>
   <button class="icon" id="openSettings"><i>⚙️</i>设置</button>
  </div>

  <div class="app" id="app" aria-hidden="true">
   <div class="bar"><button class="back" id="back">‹ 返回</button><h1>设置</h1></div>
   <div class="body">
    <label for="baseUrl">接口地址</label>
    <input id="baseUrl" placeholder="https://你的服务商地址/v1" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint">照服务商文档填写,通常以 /v1 结尾。</div>

    <label for="apiKey">API Key</label>
    <div class="row">
      <input id="apiKey" type="password" placeholder="YOUR_API_KEY" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn sm" id="eye" type="button">显示</button>
    </div>
    <div class="hint">只保存在这个浏览器里,不会写进代码或日志。</div>

    <label for="model">模型名</label>
    <input id="model" placeholder="服务商文档里的模型名" autocomplete="off" autocapitalize="off" spellcheck="false">

    <div class="row actions">
      <button class="btn" id="save">保存</button>
      <button class="btn main" id="test">连接测试</button>
    </div>
    <div class="res" id="res" hidden></div>
    <details><summary>运行日志(Key 已隐藏)</summary><pre id="log">暂无记录</pre></details>
   </div>
  </div>

  <button class="homebar" id="home" aria-label="回到主屏幕"></button>
 </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STORE = "vphone_config";
const logs = [];

/* ---------- 手机屏幕 ---------- */
function tick() {
  const d = new Date();
  const hm = d.toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit", hour12: false});
  $("clock").textContent = hm;
  $("stime").textContent = hm;
  $("date").textContent = d.toLocaleDateString("zh-CN", {month: "long", day: "numeric", weekday: "long"});
}
tick(); setInterval(tick, 15000);

function openApp(on) {
  $("screen").classList.toggle("open", on);
  $("app").setAttribute("aria-hidden", String(!on));
}
$("openSettings").onclick = () => openApp(true);
$("back").onclick = $("home").onclick = () => openApp(false);

/* ---------- 配置读写(Key 只存在本机浏览器) ---------- */
function loadCfg() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
}
function readForm() {
  return {baseUrl: $("baseUrl").value.trim(), apiKey: $("apiKey").value.trim(), model: $("model").value.trim()};
}
function saveCfg() {
  try { localStorage.setItem(STORE, JSON.stringify(readForm())); return true; } catch (e) { return false; }
}
(() => { const c = loadCfg(); $("baseUrl").value = c.baseUrl || ""; $("apiKey").value = c.apiKey || ""; $("model").value = c.model || ""; })();

$("eye").onclick = () => {
  const show = $("apiKey").type === "password";
